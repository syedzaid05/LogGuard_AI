[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logguard-ai"
version = "0.1.0"
description = "Static analysis + AI recommendations for Python security and logging hygiene"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.31.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
logguard = "logguard.cli:main"

[tool.setuptools]
packages = ["logguard", "logguard.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
